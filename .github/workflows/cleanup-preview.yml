name: Clean up PR preview

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Closed pull request number
        required: true
        type: string
      dry_run:
        description: Report resources without deleting them
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  cleanup:
    if: >-
      github.repository == 'broothie/dodo' &&
      (github.event_name != 'check_run' ||
      (github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.name == 'Workers Builds: dodo'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Never check out a PR head or execute its code with cleanup credentials.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Remove only the closed PR's preview and database
        run: node scripts/cleanup-preview.mjs --apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_PREVIEW_CLEANUP_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_CLEANUP_TOKEN }}
